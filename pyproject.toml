[project]
name = "tazo-agent-skills-dev"
version = "1.0.1"
description = "Development checks for Tazo's portable agent skill."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "tazo-sdk==0.1.2",
    "aiohttp>=3.11,<4",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
